  ["iPhone 6s / 6s Plus / SE (1st gen)","A9","15.8.8"],["iPhone 7 / 7 Plus","A10","15.8.8"],

];
const R = (p,a,b)=>Array.from({length:b-a+1},(_,i)=>p+(a+i));
const VERSIONS = [
  "15.0","15.0.1","15.0.2","15.1","15.1.1","15.2","15.2.1","15.3","15.3.1","15.4","15.4.1","15.5","15.6","15.6.1",

  "26.0","26.0.1","26.1","26.2","26.2.1","26.3"
];  // Versions that are missing here can be typed in with "Other version".

const num=v=>v.split(".").map(Number);
const cmp=(a,b)=>{const x=num(a),y=num(b);for(let i=0;i<3;i++){const d=(x[i]||0)-(y[i]||0);if(d)return d}return 0};
const grp=c=>["A9","A10","A11"].includes(c)?"arm64":["A12","A13"].includes(c)?"a12":["A14","A15","A16","A17"].includes(c)?"arm64e":null;
const fmt=g=>g?RG[g].map(r=>r[0]+" – "+r[1]).join(", "):"";
function supported(chip,v){
  const g=grp(chip);
  return !!g && RG[g].some(([lo,hi])=>cmp(v,lo)>=0&&cmp(v,hi)<=0);
}
// Reads e.g. "iOS 15.0 - 17.3.1 (arm64e), iOS 15.0 - 18.7.1, 26.0 - 26.0.1 (A12/A13) and iOS 15.0 - 18.7.1 (arm64)"
function parseReadme(txt){
  const re=/iOS\s+([\d.]+)\s*-\s*([\d.]+)(?:\s*,\s*([\d.]+)\s*-\s*([\d.]+))?\s*\(([^)]+)\)/g,o={};let m;
  while((m=re.exec(txt))){
    const rg=[[m[1],m[2]]];if(m[3])rg.push([m[3],m[4]]);
    if(rg.some(r=>cmp(r[0],r[1])>0))continue;
    const t=m[5].toLowerCase().trim();
    if(t==="arm64e"&&!o.arm64e)o.arm64e=rg;
    else if(t.includes("a12")&&!o.a12)o.a12=rg;
    else if(t==="arm64"&&!o.arm64)o.arm64=rg;
  }
  return(o.arm64e&&o.arm64)?{arm64:o.arm64,arm64e:o.arm64e,a12:o.a12||o.arm64e}:null;
}

function buildSelects(){
  const d=$("device"),keep=d.value;
  d.innerHTML="";d.add(new Option(T[lang].selDev,""));
  DEVICES.forEach((x,i)=>d.add(new Option(x[0],i)));
  d.value=keep;fillVersions();
}
function fillVersions(){
  const v=$("version"),keep=v.value;
  v.innerHTML="";v.add(new Option(T[lang].selVer,""));
  const d=$("device").value;
  v.disabled=d==="";
  if(d!==""){
    VERSIONS.filter(x=>cmp(x,DEVICES[d][2])<=0).reverse().forEach(x=>v.add(new Option(x,x)));
    v.add(new Option(T[lang].other,"__other"));
  }
  v.value=[...v.options].some(o=>o.value===keep)?keep:"";
}
function check(){
  const d=$("device").value,sel=$("version").value,r=$("result"),b=$("install"),t=T[lang],oth=$("other");
  r.className="";b.disabled=true;
  oth.style.display=sel==="__other"?"block":"none";oth.placeholder=t.otherPh;
  $("src").textContent=t[srcLive?"srcLive":"srcFix"];
  if(d===""){r.textContent=t.pick;return}
  const [name,chip]=DEVICES[d],g=grp(chip);
  const rangeTxt=g?f(t.range,{c:chip,r:fmt(g)}):t.norange;
  if(sel===""){r.textContent=rangeTxt;return}
  const v=sel==="__other"?oth.value.trim():sel;
  if(sel==="__other"&&!/^\d+(\.\d+){1,2}$/.test(v)){r.textContent=t.enter;return}
  if(supported(chip,v)){r.className="ok";r.textContent=f(t.ok,{d:name,c:chip,v});b.disabled=false}
  else{r.className="no";r.textContent=f(t.no,{c:chip,v})+" "+rangeTxt}
  store.set("dev",d);store.set("ver",sel);
}
function renderRel(){
  if(!relInfo){$("rel").textContent="";return}
  $("rel").textContent=f(T[lang].latest,{t:relInfo.t,d:relInfo.d,s:relInfo.s?", "+relInfo.s+" MB":""});
}
function renderSteps(){
  const done=JSON.parse(store.get("done")||"[]"),S=T[lang].steps,ul=$("steps");
  ul.innerHTML="";
  S.forEach((s,i)=>{
    const li=document.createElement("li"),cb=document.createElement("input"),sp=document.createElement("span");
    cb.type="checkbox";cb.checked=done.includes(i);sp.innerHTML=s;
    li.className=cb.checked?"done":"";
    cb.onchange=()=>{const a=JSON.parse(store.get("done")||"[]").filter(x=>x!==i);if(cb.checked)a.push(i);store.set("done",JSON.stringify(a));renderSteps()};
    li.append(cb,sp);ul.append(li);
  });
  $("prog").textContent=f(T[lang].prog,{n:done.filter(i=>i<S.length).length,m:S.length});
}
function render(){
  const t=T[lang];document.documentElement.lang=lang;
  document.querySelectorAll("[data-i]").forEach(e=>e.innerHTML=t[e.dataset.i]);
  $("l-en").className=lang==="en"?"on":"";$("l-ru").className=lang==="ru"?"on":"";
  $("sileoList").innerHTML=t.sileo.map(x=>"<li>"+x+"</li>").join("");
  $("trouble").innerHTML=t.trouble.map(x=>"<details><summary>"+x[0]+"</summary><p>"+x[1]+"</p></details>").join("");
  buildSelects();check();renderSteps();renderRel();
}

// ---------- Events ----------
$("l-en").onclick=()=>{lang="en";store.set("lang",lang);render()};
$("l-ru").onclick=()=>{lang="ru";store.set("lang",lang);render()};
$("device").onchange=()=>{fillVersions();check()};
$("version").onchange=check;
$("other").oninput=check;
$("install").onclick=()=>{window.location.href=IPA_URL};
$("copy").onclick=async()=>{
  try{await navigator.clipboard.writeText(IPA_URL)}catch(e){prompt("URL",IPA_URL);return}
  const b=$("copy");b.textContent=T[lang].copied;setTimeout(()=>b.textContent=T[lang].copy,1500);
};

// ---------- Init ----------
render();
{const d=store.get("dev"),v=store.get("ver");
 if(d!==null&&DEVICES[d]){$("device").value=d;fillVersions();if(v&&[...$("version").options].some(o=>o.value===v))$("version").value=v;check()}}

// 1) Newest release + its IPA (falls back silently to the "latest/download" link)
fetch("https://api.github.com/repos/"+REPO+"/releases/latest").then(r=>r.ok?r.json():Promise.reject()).then(j=>{
  const a=(j.assets||[]).find(x=>/\.ipa$/i.test(x.name));
  if(a)IPA_URL=a.browser_download_url;
  relInfo={t:j.tag_name,s:a?(a.size/1048576).toFixed(1):"",d:(j.published_at||"").slice(0,10)};
  renderRel();
}).catch(()=>{});

// 2) Supported iOS ranges from the official README (falls back to the built-in table)
fetch("https://api.github.com/repos/"+REPO+"/readme",{headers:{Accept:"application/vnd.github.raw+json"}})
  .then(r=>r.ok?r.text():Promise.reject()).then(txt=>{
    const p=parseReadme(txt);
    if(p){RG=p;srcLive=true;check()}
  }).catch(()=>{});
</script>

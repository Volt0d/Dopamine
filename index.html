<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dopamine IPA Installer</title>
<style>
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;background:#fff;color:#111;font:16px/1.6 -apple-system,Helvetica,Arial,sans-serif}
  .top{display:flex;justify-content:space-between;align-items:center;max-width:680px;margin:0 auto;padding:14px 20px;border-bottom:1px solid #eee}
  .langs button{width:auto;margin:0 6px 0 0;padding:6px 14px;background:#fff;color:#111;border:1px solid #ccc;border-radius:20px;font-size:14px;cursor:pointer}
  .langs button.on{background:#111;color:#fff;border-color:#111}
  .brand{font-size:14px;color:#555}
  nav{max-width:680px;margin:0 auto;padding:10px 20px 0;font-size:14px}
  nav a{margin-right:16px;color:#555;text-decoration:none}
  nav a:hover{color:#111;text-decoration:underline}
  main{max-width:680px;margin:0 auto;padding:16px 20px 64px}
  h1{font-size:28px;margin:16px 0 4px}
  h2{font-size:20px;margin:44px 0 8px}
  p,li{color:#333}
  .sub{color:#666;margin:0 0 20px}
  .card{border:1px solid #ddd;border-radius:12px;padding:20px}
  label{display:block;font-weight:600;margin:14px 0 6px}
  label:first-child{margin-top:0}
  select,.btn{width:100%;padding:12px;font-size:16px;border:1px solid #ccc;border-radius:8px;background:#fff;color:#111}
  select:disabled{background:#f5f5f5;color:#999}
  .btn{background:#111;color:#fff;border-color:#111;margin-top:16px;cursor:pointer}
  .btn.alt{background:#fff;color:#111;border-color:#ccc;margin-top:8px}
  .btn:disabled{background:#ccc;border-color:#ccc;color:#fff;cursor:not-allowed}
  #result{margin-top:16px;padding:12px 14px;border-radius:8px;border:1px solid #ddd;font-size:15px;min-height:48px}
  #result.ok{border-color:#111}
  #result.no{background:#f7f7f7}
  .meta{font-size:13px;color:#777;margin-top:10px}
  .note{border:1px solid #ddd;border-radius:8px;padding:12px 14px;margin:16px 0;font-size:15px}
  .note.dark{border-color:#111}
  ol,ul{padding-left:22px}
  .steps{list-style:none;padding:0}
  .steps li{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid #f0f0f0}
  .steps input{margin-top:6px;width:18px;height:18px;flex:none}
  .steps li.done span{color:#999;text-decoration:line-through}
  #prog{font-size:14px;color:#777}
  details{border:1px solid #ddd;border-radius:8px;padding:10px 14px;margin:8px 0}
  summary{cursor:pointer;font-weight:600}
  a{color:#111}
  code{background:#f3f3f3;padding:1px 5px;border-radius:4px}
  footer{margin-top:48px;font-size:13px;color:#777}
  :focus-visible{outline:2px solid #111;outline-offset:2px}
</style>
</head>
<body>
<div class="top">
  <div class="langs"><button id="l-en" class="on">English</button><button id="l-ru">Русский</button></div>
  <div class="brand">&copy; Volt0d</div>
</div>
<nav><a href="#dl" data-i="nDl"></a><a href="#guide" data-i="nGuide"></a><a href="#sileo" data-i="nSileo"></a><a href="#help" data-i="nHelp"></a></nav>

<main>

  <p class="sub" data-i="sub"></p>

    <label for="version" data-i="ver"></label>
    <select id="version" disabled></select>
    <div id="result" role="status"></div>
    <button class="btn" id="install" disabled data-i="install"></button>
    <button class="btn alt" id="copy" data-i="copy"></button>
    <div class="meta" id="rel"></div>
  </section>

  <div class="note dark" data-i="backup"></div>

  <h2 id="guide" data-i="gT"></h2>
  <p id="prog"></p>
  <ul class="steps" id="steps"></ul>

  <h2 id="flash" data-i="fT"></h2>
  <p data-i="fP"></p>

  <h2 id="sileo" data-i="sT"></h2>
  <p data-i="sP"></p>
  <ol id="sileoList"></ol>

  <h2 data-i="tT"></h2>
  <p data-i="tP"></p>

  <h2 data-i="idT"></h2>
  <p data-i="idP"></p>

  <h2 data-i="oT"></h2>
  <p data-i="oP"></p>

  <h2 id="help" data-i="hT"></h2>
  <div id="trouble"></div>

  <footer data-i="foot"></footer>

  ["iPhone 15 Pro / 15 Pro Max","A17","26.3"]

const R = (p,a,b)=>Array.from({length:b-a+1},(_,i)=>p+(a+i));
const VERSIONS = [
  "15.0","15.0.1","15.0.2","15.1","15.1.1","15.2","15.2.1","15.3","15.3.1","15.4","15.4.1","15.5","15.6","15.6.1",

  "26.0","26.0.1","26.1","26.2","26.2.1","26.3"
];
// Support by chip (Dopamine 3.x). Check github.com/opa334/Dopamine for changes.
const RANGES = {A9:"15.0 – 18.7.1",A10:"15.0 – 18.7.1",A11:"15.0 – 18.7.1",A12:"15.0 – 18.7.1, 26.0 – 26.0.1",A13:"15.0 – 18.7.1, 26.0 – 26.0.1",A14:"15.0 – 17.3.1",A15:"15.0 – 17.3.1",A16:"15.0 – 17.3.1",A17:"15.0 – 17.3.1"};
const num = v=>v.split(".").map(Number);
const cmp=(a,b)=>{const x=num(a),y=num(b);for(let i=0;i<3;i++){const d=(x[i]||0)-(y[i]||0);if(d)return d}return 0};
function supported(chip,v){
  if(cmp(v,"15.0")<0)return false;
  if(["A9","A10","A11"].includes(chip))return cmp(v,"18.7.1")<=0;
  if(["A12","A13"].includes(chip))return cmp(v,"18.7.1")<=0||(cmp(v,"26.0")>=0&&cmp(v,"26.0.1")<=0);
  return cmp(v,"17.3.1")<=0;
}

// ---------- State ----------
const $=id=>document.getElementById(id);
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
let lang=store.get("lang")||"en"; if(!T[lang])lang="en";
let relInfo=null;
const f=(s,o)=>s.replace(/\{(\w+)\}/g,(_,k)=>o[k]);

function buildSelects(){
  const d=$("device"),keep=d.value;
  d.innerHTML="";d.add(new Option(T[lang].selDev,""));
  DEVICES.forEach((x,i)=>d.add(new Option(x[0],i)));
  d.value=keep;fillVersions();
}
function fillVersions(){
  const v=$("version"),keep=v.value;
  v.innerHTML="";v.add(new Option(T[lang].selVer,""));
  const d=$("device").value;
  v.disabled=d==="";
  if(d!==""){VERSIONS.filter(x=>cmp(x,DEVICES[d][2])<=0).reverse().forEach(x=>v.add(new Option(x,x)))}
  v.value=[...v.options].some(o=>o.value===keep)?keep:"";
}
function check(){
  const d=$("device").value,v=$("version").value,r=$("result"),b=$("install"),t=T[lang];
  r.className="";b.disabled=true;
  if(d===""){r.textContent=t.pick;return}
  const [name,chip]=DEVICES[d];
  if(v===""){r.textContent=f(t.range,{c:chip,r:RANGES[chip]});return}
  if(supported(chip,v)){r.className="ok";r.textContent=f(t.ok,{d:name,c:chip,v});b.disabled=false}
  else{r.className="no";r.textContent=f(t.no,{c:chip,v})+" "+f(t.range,{c:chip,r:RANGES[chip]})}
  store.set("dev",d);store.set("ver",v);
}
function renderRel(){
  if(!relInfo){$("rel").textContent="";return}
  $("rel").textContent=f(T[lang].latest,relInfo);
}
function renderSteps(){
  const done=JSON.parse(store.get("done")||"[]"),S=T[lang].steps,ul=$("steps");
  ul.innerHTML="";
  S.forEach((s,i)=>{
    const li=document.createElement("li"),cb=document.createElement("input"),sp=document.createElement("span");
    cb.type="checkbox";cb.checked=done.includes(i);sp.innerHTML=s;
    li.className=cb.checked?"done":"";
    cb.onchange=()=>{const a=JSON.parse(store.get("done")||"[]").filter(x=>x!==i);if(cb.checked)a.push(i);store.set("done",JSON.stringify(a));renderSteps()};
    li.append(cb,sp);ul.append(li);
  });
  $("prog").textContent=f(T[lang].prog,{n:done.filter(i=>i<S.length).length,m:S.length});
}
function render(){
  const t=T[lang];document.documentElement.lang=lang;
  document.querySelectorAll("[data-i]").forEach(e=>e.innerHTML=t[e.dataset.i]);
  $("l-en").className=lang==="en"?"on":"";$("l-ru").className=lang==="ru"?"on":"";
  $("sileoList").innerHTML=t.sileo.map(x=>"<li>"+x+"</li>").join("");
  $("trouble").innerHTML=t.trouble.map(x=>"<details><summary>"+x[0]+"</summary><p>"+x[1]+"</p></details>").join("");
  buildSelects();check();renderSteps();renderRel();
}

// ---------- Events ----------
$("l-en").onclick=()=>{lang="en";store.set("lang",lang);render()};
$("l-ru").onclick=()=>{lang="ru";store.set("lang",lang);render()};
$("device").onchange=()=>{fillVersions();check()};
$("version").onchange=check;
$("install").onclick=()=>{window.location.href=IPA_URL};
$("copy").onclick=async()=>{
  try{await navigator.clipboard.writeText(IPA_URL)}catch(e){prompt("URL",IPA_URL);return}
  const b=$("copy");b.textContent=T[lang].copied;setTimeout(()=>b.textContent=T[lang].copy,1500);
};

// ---------- Init ----------
